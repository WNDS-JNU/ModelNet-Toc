# Public-IP HTTPS/WSS ingress for ModelNet Desktop.
# Gateway traffic reaches 4A100 only through loopback SSH reverse forwards.
# Only the four exact public routes below are exposed.

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl default_server;
    server_name 123.56.135.150;

    ssl_certificate /etc/lego-ip/certificates/modelnet-gateway-ip.crt;
    ssl_certificate_key /etc/lego-ip/certificates/modelnet-gateway-ip.key;

    client_max_body_size 1m;

    location = /ws {
        proxy_pass http://127.0.0.1:13093/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:13093/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /dev/ws {
        proxy_pass http://127.0.0.1:13193/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location = /dev/healthz {
        proxy_pass http://127.0.0.1:13193/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
